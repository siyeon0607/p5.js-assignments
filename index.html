<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>p5.js-assignments</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <h1>p5.js-assignments</h1>
    <main class="grid-container">
        <div class="card">
            <h2>과제 1</h2>
            <div id="canvas-assignment1" class="canvas-container"></div>
        </div>
        <div class="card">
            <h2>과제 4</h2>
            <div id="canvas-assignment4" class="canvas-container"></div>
        </div>
        <div class="card">
            <h2>과제 2</h2>
            <div id="canvas-assignment2" class="canvas-container"></div>
        </div>
        <div class="card">
            <h2>과제 3</h2>
            <div id="canvas-assignment3" class="canvas-container"></div>
        </div>
    </main>

    <script>
        // 각 폴더의 sketch.js를 로드하기 전, p5가 타겟 ID를 인식하도록 강제합니다.
        function loadSketch(path, targetId) {
            const script = document.createElement('script');
            script.src = path;
            // 실행 전 캔버스 위치를 미리 지정
            window.p5Target = targetId; 
            document.body.appendChild(script);
        }
    </script>
    
    <script src="assignment1/sketch.js"></script>
    <script src="assignment2/sketch.js"></script>
    <script src="assignment3/sketch.js"></script>
    <script src="assignment4/sketch.js"></script>
</body>
</html>
